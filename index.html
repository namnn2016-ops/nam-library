<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nam Library - Hệ Thống Quản Lý Thư Viện Thông Minh và Tối Ưu Tốc Độ Cho Windows" />
    <title>Nam Library - Hệ Thống Quản Lý Thư Viện Thông Minh</title>
    <style>
      .cl-footer,
      .cl-footerAction,
      .cl-footerPages,
      .cl-footerItem,
      .cl-userButtonPopoverFooter,
      .cl-development-badge,
      [data-localization-key="developmentMode"],
      [class*="cl-footer"],
      [class*="footerAction"],
      [class*="developmentBadge"],
      [class*="cl-development-badge"],
      a[href*="clerk.com"],
      a[href*="clerk.dev"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        function removeClerkDevWatermarks() {
          try {
            const root = document.body || document.documentElement;
            if (!root) return;
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            let node;
            const toHide = [];
            while ((node = walker.nextNode())) {
              const text = node.nodeValue ? node.nodeValue.trim() : '';
              if (text === 'Development mode' || text.indexOf('Secured by') !== -1) {
                if (node.parentElement) {
                  toHide.push(node.parentElement);
                }
              }
            }
            toHide.forEach(function(el) {
              el.style.setProperty('display', 'none', 'important');
              el.style.setProperty('visibility', 'hidden', 'important');
              el.style.setProperty('opacity', '0', 'important');
              el.style.setProperty('height', '0px', 'important');
              if (el.parentElement && el.parentElement.tagName !== 'BODY' && el.parentElement.tagName !== 'HTML') {
                if (el.parentElement.children.length <= 2) {
                  el.parentElement.style.setProperty('display', 'none', 'important');
                }
              }
            });
          } catch (e) {}
        }

        setInterval(removeClerkDevWatermarks, 250);
        if (window.MutationObserver) {
          const observer = new MutationObserver(removeClerkDevWatermarks);
          observer.observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
